# GitLab CI auto-deploy sourcescore.org to CF Pages on push to main.
# Operator one-time setup: add CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID
# to project Settings > CI/CD > Variables.

stages:
  - build
  - deploy

variables:
  NODE_VERSION: "24"
  # Microsoft Clarity project ID (public client-side identifier, not a secret).
  # Baked into static export at build time; components/Clarity.tsx loads Clarity
  # script only when this is set. Project: SourceScore (wk6sqdp5vn).
  NEXT_PUBLIC_CLARITY_PROJECT_ID: "wk6sqdp5vn"
  # RankScale affiliate link — LIVE since 2026-08-11 (Rewardful program, approved).
  # Committed on purpose: this is a PUBLIC referral URL, not a secret — it ships
  # verbatim in the rendered HTML anyway. It lives here rather than in the CF Pages
  # dashboard because THIS GitLab CI job runs the build, and dashboard env vars are
  # not visible to it; a dashboard-only value would silently produce an empty slot.
  # Deactivate = delete this line and push. See docs/AFFILIATE-ACTIVATION.md.
  NEXT_PUBLIC_AFF_RANKSCALE: "https://rankscale.ai?via=paulo"
  # Mangools affiliate — LIVE since 2026-08-11. Auto-enrolled for every account,
  # no approval step. Commission is tiered on trailing-3-month revenue you bring:
  # Silver 25% (current) → Gold 30% at $100/mo → Platinum 35% at $500/mo, and it
  # recurs for as long as the referred customer pays.
  #
  # The affiliate ID is a URL *fragment* (`#a<accountId>`), appended to any
  # Mangools property URL — their client-side JS reads the hash and sets the
  # tracking cookie. That means the ID never reaches their server as a query
  # param, so don't "normalise" it into `?ref=`; the fragment IS the mechanism.
  #
  # Pointed at AI Search Watcher rather than the KWFinder homepage: it tracks
  # visibility inside ChatGPT/Gemini answers, which is the one Mangools tool this
  # audience is actually shopping for.
  NEXT_PUBLIC_AFF_SLOT1_NAME: "Mangools AI Search Watcher"
  NEXT_PUBLIC_AFF_SLOT1_NOTE: "Tracks whether ChatGPT and Gemini mention your site, alongside a full SEO suite."
  NEXT_PUBLIC_AFF_SLOT1_URL: "https://mangools.com/ai-search-watcher#a6a7b136b6aee0841ae53d49e"

cache:
  # v4 = invalidate when NEXT_PUBLIC_* env-baked vars change (Clarity ID 2026-05-08,
  # RankScale affiliate URL 2026-08-11, Mangools slot-1 2026-08-11).
  # Bumping the key forces fresh `.next/cache/` so static-export HTML re-renders with new env.
  # Forgetting this bump is a silent failure: the build succeeds and the new slot
  # renders empty, because Next serves the cached HTML from before the var existed.
  key: sourcescore-cache-v4
  paths:
    - node_modules/
    - .next/cache/

build:
  stage: build
  image: node:24-bookworm-slim
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends git ca-certificates
  script:
    - npm ci --no-audit --no-fund
    - rm -rf .next/cache
    - npm run build
    - test -d out
    - test -f out/index.html
    # Verify postbuild generators produced their artifacts (sitemap, llms, sitemap-ai)
    # Catches 2026-05-12-class root cause: generator silently fails -> sitemap.xml absent in deploy.
    - node scripts/predeploy-guard.mjs
  artifacts:
    paths:
      - out/
    expire_in: 1 day
  only:
    - main

deploy:
  stage: deploy
  # FAIL-CLOSED (2026-09-24): manual. rg-freeze-guard and its register exist only on the Macs, so CI
  # cannot check freezes itself. Start this job ONLY via `ci-guarded-deploy sourcescore.org 81957978`
  # (VAULT-Fleet scripts/fleet-mode/ci-guarded-deploy), which runs the guard first and refuses on a
  # freeze or a missing guard. The signed build is CI-only, so validate-only was not an option here.
  when: manual
  allow_failure: false
  image: node:24-bookworm-slim
  needs:
    - build
  before_script:
    - apt-get update
    # `git` is installed deliberately: node:24-bookworm-slim ships without it, and
    # without git in PATH `wrangler --commit-dirty=true` cannot read a SHA, so CF
    # records commit_hash=None for every CI deploy. Measured 2026-09-03 — pipeline
    # 2813969140's deploy job ran 16:09:23-16:11:05 and produced the CF deployment
    # at 16:10:46 with commit_hash=None, while sibling colorcombinations (full
    # node:22, which HAS git) records the SHA on every CI deploy. The deploy was
    # real; only its provenance was missing, which is the deploy-truth question
    # ("which commit is live?") going unanswerable.
    - apt-get install -y --no-install-recommends ca-certificates git
    - npm install -g wrangler@4
  script:
    - test -d out
    - test -n "$CLOUDFLARE_API_TOKEN"
    - test -n "$CLOUDFLARE_ACCOUNT_ID"
    # Re-run the guard at deploy stage too — defends against artifact corruption between jobs
    # OR against any future ad_hoc CI workflow that skips build.
    - node scripts/predeploy-guard.mjs
    - |
      set -o pipefail
      wrangler pages deploy out --project-name sourcescore --branch main --commit-dirty=true 2>&1 | tee /tmp/deploy.log
    # POST-DEPLOY ASSERTION. wrangler can exit 0 having uploaded nothing, and until
    # now nothing here would have noticed.
    #
    # ASSERTS THE DEPLOYMENT URL, NOT commit_hash — deliberately. The equality form
    # used by colorcombinations/haulchart would FALSE-RED here: this project's CI
    # deploys record commit_hash=None (measured above). Installing git should fix
    # that, but the assertion must not DEPEND on a fix whose effect is unproven in
    # this image. wrangler prints https://<short_id>.<project>.pages.dev, and CF's
    # deployment record carries that exact string in `url` — a unique handle that
    # works regardless of whether git metadata lands, and that a sibling lane
    # deploying in the same window cannot satisfy.
    - |
      cat > /tmp/assert.mjs <<'JS'
      const acc = process.env.CLOUDFLARE_ACCOUNT_ID;
      const tok = process.env.CLOUDFLARE_API_TOKEN;
      const want = process.env.CF_DEPLOY_URL;
      const url = `https://api.cloudflare.com/client/v4/accounts/${acc}/pages/projects/sourcescore/deployments?per_page=10&env=production`;
      for (let i = 1; i <= 10; i++) {
        let body;
        try {
          const res = await fetch(url, { headers: { Authorization: `Bearer ${tok}` } });
          body = await res.json();
        } catch (e) {
          console.error(`  attempt ${i}: CF API unreachable — ${e.message}`);
          await new Promise(s => setTimeout(s, 15000));
          continue;
        }
        // An API that cannot answer is a FAILURE, never a pass.
        if (!body.success) {
          console.error('ASSERTION FAILED: CF API returned success:false —', JSON.stringify(body.errors || []).slice(0, 300));
          process.exit(1);
        }
        const list = body.result || [];
        if (list.length === 0) {
          console.error('ASSERTION FAILED: CF reports zero production deployments for this project.');
          process.exit(1);
        }
        const mine = list.find(d => d.url === want);
        if (mine) {
          if (mine.environment !== 'production') {
            console.error(`ASSERTION FAILED: ${want} is '${mine.environment}', not production.`);
            process.exit(1);
          }
          const st = (mine.latest_stage || {}).status;
          if (st === 'success') { console.log(`VERIFIED: production deployment ${mine.id} is live at ${want}.`); process.exit(0); }
          if (st === 'failure' || st === 'canceled') { console.error(`ASSERTION FAILED: ${want} ended '${st}'.`); process.exit(1); }
          console.log(`  attempt ${i}: found ${want}, stage '${st}' — waiting.`);
        } else {
          console.log(`  attempt ${i}: newest is ${list[0].url} — waiting for ${want}.`);
        }
        await new Promise(s => setTimeout(s, 15000));
      }
      console.error(`ASSERTION FAILED: after ~2.5 min no successful production deployment exists at ${want}.`);
      console.error('wrangler exited 0 but nothing reached production — the green-and-wrong case this assertion exists to catch.');
      process.exit(1);
      JS
    - |
      DEP_URL=$(grep -oE 'https://[0-9a-f]{8}\.sourcescore\.pages\.dev' /tmp/deploy.log | tail -1)
      if [ -z "$DEP_URL" ]; then
        echo "ASSERTION FAILED: no deployment URL in wrangler output."
        echo "Either nothing was created, or wrangler changed its output format."
        echo "A check that cannot see must not report OK — failing loudly rather than passing blind."
        exit 1
      fi
      echo "asserting $DEP_URL reached production..."
      CF_DEPLOY_URL="$DEP_URL" node /tmp/assert.mjs
  only:
    - main

# IndexNow ping after every deploy (Bing = the index ChatGPT/Copilot cite from —
# the site's one live human channel). ping-indexnow.mjs auto-detects the key from
# out/<KEY>.txt and has a wait-for-key-live guard (never pings before the key
# file serves, which would cache-poison the key at Bing). Non-blocking.
indexnow:
  stage: deploy
  image: node:24-bookworm-slim
  needs:
    - deploy
    # `needs: [deploy]` does not transitively download build artifacts. Fetch the
    # static export explicitly because ping-indexnow reads its key from out/.
    - job: build
      artifacts: true
  script:
    - test -d out
    - node scripts/ping-indexnow.mjs
  only:
    - main
  allow_failure: true

# Re-sync the CF Vectorize semantic index after claim-catalog changes, so
# /api/v1/verify (semantic) returns newly-added claims. Runs ONLY when the
# claims file (or this CI file) changed — content-only deploys skip it. CI
# already holds SOURCESCORE_SIGNING_SECRET (used to sign the catalog); the same
# secret gates /api/admin/reembed. Non-blocking: a transient re-embed failure
# (e.g. a CF incident) does NOT fail the deploy — re-run by re-touching the file.
reembed:
  stage: deploy
  image: node:24-bookworm-slim
  needs:
    - deploy
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends curl ca-certificates
  script:
    - test -n "$SOURCESCORE_SIGNING_SECRET"
    # Wait until the live claims.json reflects THIS deploy (count matches the
    # committed source) before re-embedding — fixes the propagation race where
    # a fixed sleep let reembed read a stale (pre-deploy) catalog.
    - 'EXPECTED=$(grep -c "subject:" data/claims-ai-ml.ts)'
    - 'echo "expected live claim count = $EXPECTED"'
    - 'for i in $(seq 1 18); do LIVE=$(curl -fsS --max-time 20 "https://sourcescore.org/api/v1/claims.json" | grep -o "\"id\"" | wc -l | tr -d " "); echo "attempt $i live=$LIVE expected=$EXPECTED"; [ "$LIVE" = "$EXPECTED" ] && break; sleep 10; done'
    - 'KEY=$(node -e "console.log(encodeURIComponent(process.env.SOURCESCORE_SIGNING_SECRET||\"\"))")'
    - 'curl -fsS --max-time 180 "https://sourcescore.org/api/admin/reembed?key=$KEY"'
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - data/claims-ai-ml.ts
        - .gitlab-ci.yml
  allow_failure: true
