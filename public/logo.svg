<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
  <!-- SourceScore mark v2 — 3 ascending bars (Discipline · Modern Reference · Velocity)
       + a score-dot capping the tallest bar = THE measured score the product surfaces.
       Distinct from generic chart icons; the dot is the scorecard signal.
       Uses currentColor so the parent's text class drives the fill. -->
  <rect x="3"  y="15" width="4" height="6"  rx="1" opacity="0.45"/>
  <rect x="10" y="11" width="4" height="10" rx="1" opacity="0.72"/>
  <rect x="17" y="6"  width="4" height="15" rx="1"/>
  <!-- Score-dot: the measured outcome floating above the tallest bar. -->
  <circle cx="19" cy="3" r="1.6"/>
</svg>
