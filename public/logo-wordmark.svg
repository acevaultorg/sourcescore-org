<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 48" aria-label="SourceScore">
  <!-- Full lockup v2: mark + wordmark in brand colors, sized for header / OG / Organization JSON-LD logo.
       Mark = 3 ascending bars + score-dot (the product semantic — "the measured score"). -->
  <!-- Mark (left, 36×36 in brand indigo) -->
  <g transform="translate(6, 6)">
    <rect width="36" height="36" rx="8" fill="#818cf8" opacity="0.10"/>
    <rect width="36" height="36" rx="8" fill="none" stroke="#818cf8" stroke-opacity="0.32" stroke-width="1"/>
    <!-- Three ascending bars (Discipline · Modern Reference · Velocity) -->
    <rect x="6"  y="23" width="5" height="8"  rx="1.2" fill="#818cf8" opacity="0.45"/>
    <rect x="14" y="18" width="5" height="13" rx="1.2" fill="#818cf8" opacity="0.72"/>
    <rect x="22" y="12" width="5" height="19" rx="1.2" fill="#818cf8"/>
    <!-- Score-dot: the measured outcome floating above the tallest bar. -->
    <circle cx="24.5" cy="8.5" r="2.2" fill="#818cf8"/>
  </g>
  <!-- Wordmark — SourceScore in tighter kerning + slightly heavier weight for premium feel -->
  <text x="56" y="32"
        font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="22" font-weight="650" letter-spacing="-0.022em" fill="#e5e7ee">SourceScore</text>
</svg>
