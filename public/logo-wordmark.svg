<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 48" aria-label="SourceScore">
  <!-- Full lockup: mark + wordmark in brand colors, sized for header/OG use. -->
  <!-- Mark (left, 36×36 in brand indigo) -->
  <g transform="translate(6, 6)">
    <rect width="36" height="36" rx="8" fill="#818cf8" opacity="0.1"/>
    <rect width="36" height="36" rx="8" fill="none" stroke="#818cf8" stroke-opacity="0.32" stroke-width="1"/>
    <rect x="6"  y="22" width="5" height="9"  rx="1.2" fill="#818cf8" opacity="0.55"/>
    <rect x="14" y="17" width="5" height="14" rx="1.2" fill="#818cf8" opacity="0.78"/>
    <rect x="22" y="11" width="5" height="20" rx="1.2" fill="#818cf8"/>
  </g>
  <!-- Wordmark -->
  <text x="56" y="32" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="22" font-weight="600" letter-spacing="-0.02em" fill="#e5e7ee">SourceScore</text>
</svg>
