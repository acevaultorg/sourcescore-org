<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Favicon v2 — 32×32 with brand-tinted background for tab visibility on light + dark themes.
       Three ascending bars (Discipline · Modern Reference · Velocity) + score-dot capping the tallest.
       The dot survives down to 16×16 because it's anchored at the high-contrast top edge. -->
  <rect width="32" height="32" rx="6" fill="#0a0a0f"/>
  <rect width="32" height="32" rx="6" fill="#818cf8" opacity="0.10"/>
  <rect x="5"  y="20" width="5" height="8"  rx="1.2" fill="#818cf8" opacity="0.45"/>
  <rect x="13" y="15" width="5" height="13" rx="1.2" fill="#818cf8" opacity="0.72"/>
  <rect x="21" y="9"  width="5" height="19" rx="1.2" fill="#818cf8"/>
  <!-- Score-dot: the measurable outcome floating above the tallest bar. -->
  <circle cx="23.5" cy="5.5" r="2.2" fill="#818cf8"/>
</svg>
