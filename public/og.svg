<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="100%" stop-color="#141420"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- subtle grid -->
  <g stroke="#262638" stroke-width="0.5" opacity="0.5">
    <line x1="0" y1="157" x2="1200" y2="157"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="472" x2="1200" y2="472"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
  </g>

  <!-- brand mark -->
  <g transform="translate(80, 80)">
    <rect x="0" y="0" width="56" height="56" rx="12" fill="rgba(129,140,248,0.12)" stroke="#818cf8" stroke-width="1.5" stroke-opacity="0.4"/>
    <text x="28" y="40" font-family="-apple-system, sans-serif" font-size="32" font-weight="700" fill="#818cf8" text-anchor="middle">★</text>
  </g>
  <text x="160" y="120" font-family="-apple-system, sans-serif" font-size="28" font-weight="600" fill="#e5e7ee">SourceScore</text>

  <!-- main headline -->
  <text x="80" y="290" font-family="-apple-system, sans-serif" font-size="76" font-weight="700" fill="#e5e7ee" letter-spacing="-1.5">How citable is</text>
  <text x="80" y="370" font-family="-apple-system, sans-serif" font-size="76" font-weight="700" fill="url(#accent)" letter-spacing="-1.5">any source in the AI era?</text>

  <!-- subhead -->
  <text x="80" y="440" font-family="-apple-system, sans-serif" font-size="26" fill="#9499a8">Score Discipline · Modern Reference · Velocity</text>

  <!-- footer -->
  <text x="80" y="560" font-family="ui-monospace, monospace" font-size="18" fill="#7a8198">sourcescore.org</text>
  <text x="1120" y="560" font-family="-apple-system, sans-serif" font-size="18" font-weight="600" fill="#818cf8" text-anchor="end">Methodology v0.1</text>
</svg>
